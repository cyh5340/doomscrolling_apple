# XcodeGen spec. The generated Doomscroll.xcodeproj is committed, so XcodeGen is only needed after editing this:
#   brew install xcodegen && xcodegen
name: Doomscroll
options:
  deploymentTarget:
    iOS: "17.4"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: true

packages:
  DoomscrollKit:
    path: Packages/DoomscrollKit
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.55.0"
  # 12.x: 13.x deprecates FCM registration tokens, which the backend's send-alert function sends to.
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    majorVersion: "12.0.0"

targets:
  Doomscroll:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: DoomscrollKit
      - package: Supabase
        product: Supabase
      - package: Firebase
        product: FirebaseMessaging
      - target: DoomscrollMonitor
      - target: DoomscrollReport
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app
        PRODUCT_NAME: Doomscroll
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Doomscroll
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown,
           UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [com.doomscroll.app.upload]
        # Push tokens are handed to Firebase by hand (Push.swift), so no method swizzling.
        FirebaseAppDelegateProxyEnabled: false
        # Debug builds talk to the local Supabase stack over plain HTTP.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        DSSupabaseURL: $(SUPABASE_URL)
        DSSupabaseKey: $(SUPABASE_KEY)
        DSInviteHost: $(INVITE_HOST)
        DSAppGroup: $(APP_GROUP)
    entitlements:
      path: App/Doomscroll.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP)]
        aps-environment: development
        # Invite links: https://<INVITE_HOST>/join/{code}. Needs web/.well-known/apple-app-site-association there.
        com.apple.developer.associated-domains: [applinks:$(INVITE_HOST)]

  # Called by iOS at each 15-minute bucket; records it and uploads it.
  DoomscrollMonitor:
    type: app-extension
    platform: iOS
    sources:
      - MonitorExtension
    dependencies:
      - package: DoomscrollKit
      - package: Supabase
        product: Auth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app.monitor
        PRODUCT_NAME: DoomscrollMonitor
    info:
      path: MonitorExtension/Info.plist
      properties:
        CFBundleDisplayName: Doomscroll Monitor
        NSExtension:
          NSExtensionPointIdentifier: com.apple.deviceactivity.monitor-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).DeviceActivityMonitorExtension
        DSSupabaseURL: $(SUPABASE_URL)
        DSSupabaseKey: $(SUPABASE_KEY)
        DSAppGroup: $(APP_GROUP)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: MonitorExtension/DoomscrollMonitor.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP)]

  # Draws the Today ring with exact minutes, sandboxed inside the app's window.
  DoomscrollReport:
    type: extensionkit-extension
    platform: iOS
    sources:
      - ReportExtension
    dependencies:
      - package: DoomscrollKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).app.report
        PRODUCT_NAME: DoomscrollReport
    info:
      path: ReportExtension/Info.plist
      properties:
        CFBundleDisplayName: Doomscroll Report
        EXAppExtensionAttributes:
          EXExtensionPointIdentifier: com.apple.deviceactivityui.report-extension
        DSAppGroup: $(APP_GROUP)
    entitlements:
      path: ReportExtension/DoomscrollReport.entitlements
      properties:
        com.apple.developer.family-controls: true
        com.apple.security.application-groups: [$(APP_GROUP)]

schemes:
  Doomscroll:
    build:
      targets:
        Doomscroll: all
    run:
      config: Debug
    archive:
      config: Release
