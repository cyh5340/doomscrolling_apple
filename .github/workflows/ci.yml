name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (shared package)
        working-directory: Packages/DoomscrollKit
        run: swift test
      - name: Build app and extensions
        run: >
          xcodebuild -project Doomscroll.xcodeproj -scheme Doomscroll
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
